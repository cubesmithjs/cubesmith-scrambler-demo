name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege (security_audit_plan F-12): nothing by default, and each job
# declares what it needs. The build job runs `npm ci` and the whole build —
# every install script of every dependency — so it must not hold the Pages
# write or OIDC permissions; only the deploy job, which runs one GitHub action
# and no third-party code, gets those.
permissions: {}

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's settings (`GET /repos/.../pages`).
      pages: read
    steps:
      # `persist-credentials: false` keeps GITHUB_TOKEN out of the checkout, where
      # every install script `npm ci` runs could otherwise read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves files and runs no code, so the Route Handler cannot come
      # along: `output: export` fails outright on a dynamic route. Deleting it
      # here rather than in the repo leaves the normal build — the one with both
      # call sites, deployed anywhere with compute — completely untouched.
      - name: Drop the server-only Route Handler
        run: rm -rf src/app/api

      - name: Build the static export
        run: npm run build
        env:
          STATIC_EXPORT: '1'

      # Without this Pages pipes the output through Jekyll, which skips every
      # path beginning with an underscore — including Next's _next/ directory,
      # so the site would load with no JavaScript and no styles.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # 🔴 `include-hidden-files` is load-bearing: since v4 this action drops
      # dotfiles from the artifact by default, which would silently remove the
      # `.nojekyll` written above.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
