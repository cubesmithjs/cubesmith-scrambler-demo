name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only; publishing to Pages needs these.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves files and runs no code, so the Route Handler cannot come
      # along: `output: export` fails outright on a dynamic route. Deleting it
      # here rather than in the repo leaves the normal build — the one with both
      # call sites, deployed anywhere with compute — completely untouched.
      - name: Drop the server-only Route Handler
        run: rm -rf src/app/api

      - name: Build the static export
        run: npm run build
        env:
          STATIC_EXPORT: '1'

      # Without this Pages pipes the output through Jekyll, which skips every
      # path beginning with an underscore — including Next's _next/ directory,
      # so the site would load with no JavaScript and no styles.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
