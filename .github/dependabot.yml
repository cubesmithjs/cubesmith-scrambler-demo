# security_audit_plan F-12 / I-18 — automated dependency and action updates,
# the same shape as @cubesmith/scrambler's. Grouped so a week's worth of patch
# bumps is one PR, not twenty.
#
# ⚠️ Every dependency here is an EXACT pin, so a Dependabot PR is the only way
# one moves — and nothing runs on a PR in this repo (pages.yml fires on push to
# main). Check a PR locally with `npm run typecheck`, `npm run build` and a
# `STATIC_EXPORT=1` build before merging it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
